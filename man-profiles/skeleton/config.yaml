approvals:
  mode: smart
  timeout: 120
  cron_mode: deny
  smart_policy: 'AUTO-APPROVE only these: read-only operations anywhere; writes confined
    to the current task workspace or /tmp or mktemp directories; git status/diff/log;
    git add and git commit confined to the current task repository; mkdir, cp, and mv
    when every destination is inside the current task workspace; dependency installation
    confined to the current task project or its virtual environment; and test, lint,
    build, and type-check commands confined to the current task project.

    Everything else requires approval, in particular: any write outside the task workspace
    (including ${HOME}/.claude/projects/<REDACTED>/memory/, ${HOME}/.local/bin/,
    ${HOME}/Library/LaunchAgents/, any profile config.yaml or skills/ directory);
    git push/reset/checkout; launchctl; deleting or overwriting anything outside the
    workspace; global or system-wide dependency installation; and dependency installation
    that runs lifecycle scripts outside the current task project.

    When uncertain whether a path is inside the workspace, require approval.

    '
  mcp_reload_confirm: true
  destructive_slash_confirm: false
command_allowlist:
  - script execution via -e/-c flag
  - delete in root path
  - git force push (rewrites remote history)
  - script execution via heredoc
  - shell command via -c/-lc flag
  - overwrite project env/config via redirection
  - recursive delete
  - execute_code
  - stop/restart hermes gateway (kills running agents)
